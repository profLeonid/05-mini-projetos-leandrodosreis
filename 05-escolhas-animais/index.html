<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css" />
  <script src="./app.js" defer></script>

<body>

  <main>
    <div class="conteudo">

      <a href="../index.html" class="voltar">← Voltar</a>

      <h1>
        Escolha de

      <label>Escolha 1</label>

        <option id="invertebrado" value="invertebrado" onclick="invertebrado()">Invertebrado</option>
      </select>

      <label>Escolha 2</label>
      <select name="select" id="select">
        <option value=""></option>
        <option value="vertebrado">Vertebrado</option>

      </select>

      <label>Escolha 3</label>
      <select name="select" id="select">
        <option value=""></option>
        <option value="vertebrado">Vertebrado</option>
        <option value="invertebrado">Invertebrado</option>
      </select>

      <button onclick="definirEscolha()">Definir Escolha</button>

      <div id="resultado" class="resultado">
        O resultado aparecerá aqui
      </div>

    </div>
  </main>

  <footer>
    <p>Prof. Fernando Leonid</p>
